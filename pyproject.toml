[project]
name = "swimlane"
version = "0.1.0"
description = "FastAPI web application for managing swimming-related data"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "authlib>=1.7.2",
    "python-jose>=3.5.0",
    "cryptography>=48.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "pylint>=4.0.5",
    "pymarkdownlnt>=0.9.37",
    "pytest>=8.0.0",
    "pyright>=1.1.411",
]

[tool.ruff]
line-length = 120
exclude = ["referances"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
