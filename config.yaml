logging:
  level: INFO  # Override with LOG_LEVEL env var
  # file: logs/app.log  # Optional alternative to LOG_FILE env var

security:
  algorithm:
    HS256
  access_token_expire_minutes:
    15
  refresh_token_expire_days:
    7
  # Where the OAuth callback redirects the browser with the local JWTs appended
  # (`{frontend_url}/auth/callback?access_token=...`). In production this is the
  # SPA origin (override with the FRONTEND_URL env var). For backend-only
  # development it can point at the backend itself, where /auth/callback serves
  # the API devtools page that captures the tokens.
  frontend_url:
    http://localhost:8000
  web_admins:
    # pete@letkeman.ca = 111122296393493391055
    - 111122296393493391055
    - sub2

sql:
  active:
    sqlite
    # postgresql

  providers:
    sqlite:
      # sqlite specific config
      sqlite_file:
        swimlane.db

    postgresql:
      # postgresql specific config values, not credentails
